name: validate

# Runs the same mkdocs build --strict as portal, but on pull requests, so a broken
# nav entry or dead anchor link is caught before merge instead of after deploy.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site_src/requirements.txt
      - run: pip install -r site_src/requirements.txt
      - run: mkdocs build --strict
